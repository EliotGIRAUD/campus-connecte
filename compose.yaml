services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    entrypoint: ["/bin/sh", "/mosquitto/config/start.sh"]
    environment:
      SIMULATOR_PASSWORD: ${SIMULATOR_PASSWORD:-simulator-demo}
      BACKEND_PASSWORD: ${BACKEND_PASSWORD:-backend-demo}
      TEACHER_PASSWORD: ${TEACHER_PASSWORD:-teacher-demo}
    ports:
      - "127.0.0.1:${MQTT_PORT:-1883}:1883"
    volumes:
      - ./infra/mosquitto:/mosquitto/config:ro
      - broker-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -u teacher -P \"$$TEACHER_PASSWORD\" -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null"]
      interval: 5s
      timeout: 4s
      retries: 12
    restart: unless-stopped

  simulator:
    build: ./infra
    environment:
      MQTT_HOST: mosquitto
      MQTT_USER: simulator
      MQTT_PASSWORD: ${SIMULATOR_PASSWORD:-simulator-demo}
      PUBLISH_INTERVAL: ${PUBLISH_INTERVAL:-2}
    volumes:
      - ./infra/devices.json:/app/devices.json:ro
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    init: true

  tools:
    build: ./infra
    profiles: ["tools"]
    entrypoint: ["python", "-m", "tools.cli"]
    environment:
      MQTT_HOST: mosquitto
      MQTT_USER: teacher
      MQTT_PASSWORD: ${TEACHER_PASSWORD:-teacher-demo}
    depends_on:
      mosquitto:
        condition: service_healthy

  tests:
    build: ./infra
    profiles: ["test"]
    command: ["python", "-m", "unittest", "discover", "-s", "tests", "-v"]
    environment:
      MQTT_HOST: mosquitto
      MQTT_USER: teacher
      MQTT_PASSWORD: ${TEACHER_PASSWORD:-teacher-demo}
      BACKEND_PASSWORD: ${BACKEND_PASSWORD:-backend-demo}
      RUN_INTEGRATION: "1"
    depends_on:
      mosquitto:
        condition: service_healthy
      simulator:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus
      POSTGRES_DB: campus
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus"]
      interval: 5s
      timeout: 4s
      retries: 12
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 4s
      retries: 12
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      PORT: 3000
      SERVICE_NAME: backend
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://campus:campus@postgres:5432/campus
      LAKE_MONGO_URL: mongodb://mongo:27017
      LAKE_MONGO_DB: campus_lake
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_USER: backend
      MQTT_PASSWORD: ${BACKEND_PASSWORD:-backend-demo}
      FRESHNESS_MS: ${FRESHNESS_MS:-10000}
      HISTORY_LIMIT: ${HISTORY_LIMIT:-200}
      AVERAGE_WINDOW_MS: ${AVERAGE_WINDOW_MS:-600000}
      AVERAGE_RETENTION_MS: ${AVERAGE_RETENTION_MS:-2592000000}
      LAKE_TTL_SECONDS: ${LAKE_TTL_SECONDS:-604800}
    ports:
      - "3000:3000"
    depends_on:
      mosquitto:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  loki:
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.4.2
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-campus-demo}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SERVER_ROOT_URL: http://localhost:3001
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/json/campus-ops.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  broker-data:
  pg-data:
  mongo-data:
  loki-data:
  grafana-data:
