listener 1883
allow_anonymous false
password_file /run/campus-auth/passwords
acl_file /mosquitto/config/acl
# Durable broker state (retained + offline queues for persistent clients).
persistence true
persistence_location /mosquitto/data/
autosave_interval 10
# Queue QoS≥1 messages for persistent sessions (clean:false) while a client is down.
# ~3 sensors × 1 msg/2s × ~10 min ≈ 900 ; keep headroom for state/availability.
max_queued_messages 5000
log_dest stdout
log_type error
log_type warning
log_type notice
